services:
  postgres:
    image: postgres:16-alpine
    container_name: ac-control-postgres
    environment:
      POSTGRES_DB: ac_control
      POSTGRES_USER: alena
      POSTGRES_PASSWORD: alena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alena -d ac_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ac-control-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ac-control-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ac_control
      DB_USERNAME: alena
      DB_PASSWORD: alena
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ac-control-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ac-control-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - ac-control-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: ac-control-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - ac-control-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ac-control-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ac-control-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  ac-control-network:
    driver: bridge
